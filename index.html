    <!--
      Tipografía.
      Se sirve primero con el stack nativo del sistema (cero bytes de red, cero
      bloqueo de render) y las webfonts se cargan de forma asíncrona encima:
      con `media="print"` la hoja no bloquea el pintado y se activa al terminar.
      Si el usuario está sin red o el dominio no resuelve, el sitio se ve igual
      de bien con la tipografía del sistema.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"

    <!--
      Precarga del póster del hero (es el LCP).

      Se inyecta por script en vez de dejar un <link> estático porque la ruta
      correcta depende del `base` del build: "/" en dominio propio y
      "/sender/" en GitHub Pages. __BASE_PATH__ lo sustituye Vite al copiar
      public/ a dist/, así que la URL es correcta en ambos destinos.

      El video NO se precarga: son 4.8 MB y en móvil ni siquiera se solicita.
      Ver src/hooks/useCinematicHero.ts.
    -->
    <script>
      (function () {
        var base = "__BASE_PATH__";
        if (base.charAt(base.length - 1) !== "/") base += "/";

        /*
          Solo se precarga en la home, que es donde el póster es el LCP.

          En una ruta profunda de GitHub Pages este archivo se sirve tras el
          rebote de 404.html, con la ruta real en ?redirect=; precargar ahí el
          póster del hero era descargar 37-56 kB que no se usan y dejaba un
          aviso en consola ("preloaded but not used").
        */
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        var ruta = redirect && redirect.charAt(0) === "/" ? redirect : window.location.pathname;
        if (ruta.slice(0, base.length - 1) === base.slice(0, -1)) {
          ruta = ruta.slice(base.length - 1) || "/";
        }
        var esHome = ruta === "/" || ruta === "/index.html";
        if (!esHome) return;

        var w = window.innerWidth < 700 ? 640 : window.innerWidth < 1200 ? 960 : 1280;
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/webp";
        link.fetchPriority = "high";
        link.href = base + "assets/hero-poster-" + w + ".webp";
        document.head.appendChild(link);

        /*
          Favicon. Se inyecta aquí por la misma razón que la precarga: su ruta
          depende del base del build. Sin esto el navegador pedía /favicon.ico
          en la raíz y se llevaba un 404, que Lighthouse reporta como error de
          consola.
        */
        var icon = document.createElement("link");
        icon.rel = "icon";
        icon.type = "image/svg+xml";
        icon.href = base + "favicon.svg";
        document.head.appendChild(icon);
      })();
    </script>
